<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Maze</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .menu {
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .menu h1 {
            font-size: clamp(32px, 6vw, 56px);
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--highlight), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .menu .subtitle {
            color: var(--text-dim);
            font-size: clamp(14px, 2.5vw, 18px);
            margin-bottom: 40px;
        }
        .game-card {
            background: var(--secondary);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 36px 32px;
            max-width: 400px;
            width: 100%;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            display: block;
        }
        .game-card:hover {
            transform: translateY(-6px);
            border-color: var(--highlight);
        }
        .game-card .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        .game-card h2 {
            font-size: 28px;
            margin-bottom: 12px;
        }
        .game-card p {
            color: var(--text-dim);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .game-card .controls-hint {
            padding-top: 12px;
            border-top: 1px solid var(--accent);
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.8;
        }
        .game-card .controls-hint kbd {
            background: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
        }
        footer {
            margin-top: 40px;
            color: var(--text-dim);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>Snake Maze</h1>
        <p class="subtitle">A puzzle of paths, trails, and ghosts</p>
        <a href="game.html" class="game-card">
            <div class="icon">🐍👻</div>
            <h2>Play Snake Maze</h2>
            <p>Navigate the maze, collect colored dots to grow your trail, and avoid the ghosts. Don't cross your own tail!</p>
            <div class="controls-hint">
                Desktop: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd><br>
                Mobile: On-screen D-pad or swipe
            </div>
        </a>
        <footer>Built with HTML5 Canvas &bull; No build step required</footer>
    </div>
</body>
</html>
